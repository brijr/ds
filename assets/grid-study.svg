    <rect x="36" y="336" width="72" height="96"/>
    <rect x="132" y="288" width="72" height="144"/>
    <rect x="228" y="240" width="72" height="192"/>
    <rect x="324" y="192" width="72" height="240"/>
    <rect x="420" y="144" width="72" height="288"/>
    <rect x="516" y="96" width="72" height="336"/>
    <rect x="612" y="48" width="168" height="168"/>
    <circle cx="1080" cy="348" r="84"/>
  </g>
</svg>
